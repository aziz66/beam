[package]
name = "beam-agent"
version = "0.1.0"
description = "Beam desktop tray agent for clipboard auto-sync"
authors = ["Beam Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["system-tray", "clipboard-read-text", "clipboard-write-text", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
arboard = "3"
keyring = "2"
base64 = "0.21"
xsalsa20poly1305 = "0.9"
rand = "0.8"
url = "2"
tauri-plugin-deep-link = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
