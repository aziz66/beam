<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beam</title>
  <meta name="description" content="Encrypted ephemeral sharing between any devices">
  <meta name="theme-color" content="#0071e3">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Landing View -->
  <div id="landing-view" class="view landing">
    <div class="landing__logo">Beam</div>
    <p class="landing__subtitle">Encrypted ephemeral sharing between any devices. No install, no accounts.</p>

    <div class="landing__actions">
      <div class="landing__qr">
        <canvas id="qr-canvas"></canvas>
        <div id="room-code" class="landing__room-code"></div>
        <div id="room-link" class="landing__link"></div>
        <div style="display: flex; gap: 0.5rem;">
          <button id="copy-link-btn" class="btn btn--primary btn--small">Copy Link</button>
          <button id="open-room-btn" class="btn btn--secondary btn--small">Open Room</button>
        </div>
      </div>

      <div class="landing__divider">or join existing</div>

      <div class="landing__join">
        <input id="join-input" class="input" type="text" placeholder="Enter room code...">
        <button id="join-btn" class="btn btn--primary">Join</button>
      </div>
    </div>
  </div>

  <!-- Room View -->
  <div id="room-view" class="view room">
    <div id="status-bar" class="status-bar"></div>

    <div class="room__header">
      <div class="room__header-left">
        <span id="header-room-code" class="room__code"></span>
        <span id="header-devices" class="room__devices"></span>
      </div>
      <div class="room__header-actions">
        <button id="header-copy-btn" class="btn btn--secondary btn--icon btn--small" title="Copy link">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="5" y="5" width="8" height="8" rx="1.5"/>
            <path d="M3 11V3.5A1.5 1.5 0 014.5 2H11"/>
          </svg>
        </button>
        <button id="header-qr-btn" class="btn btn--secondary btn--icon btn--small" title="Show QR">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="1" width="5" height="5" rx="1"/>
            <rect x="10" y="1" width="5" height="5" rx="1"/>
            <rect x="1" y="10" width="5" height="5" rx="1"/>
            <rect x="11" y="11" width="3" height="3" rx="0.5"/>
          </svg>
        </button>
        <button id="header-settings-btn" class="btn btn--secondary btn--icon btn--small" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M13 8a5 5 0 01-.5 2.1l1.3 1.3-1.4 1.4-1.3-1.3A5 5 0 018 13a5 5 0 01-2.1-.5l-1.3 1.3-1.4-1.4 1.3-1.3A5 5 0 013 8a5 5 0 01.5-2.1L2.2 4.6l1.4-1.4 1.3 1.3A5 5 0 018 3a5 5 0 012.1.5l1.3-1.3 1.4 1.4-1.3 1.3A5 5 0 0113 8z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="feed" class="room__feed">
      <div id="feed-empty" class="room__feed-empty">
        Drop files or paste anything to share
      </div>
    </div>

    <div class="room__input">
      <div class="room__input-row">
        <div id="input-field" class="room__input-field" contenteditable="true" data-placeholder="Type or paste something..."></div>
        <input id="file-input" type="file" multiple style="display: none;">
        <button id="attach-btn" class="btn btn--secondary btn--icon" title="Attach file">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15 9.5l-6.2 6.2a4 4 0 01-5.6-5.6l7.4-7.4a2.5 2.5 0 013.5 3.5L7 13.3a1 1 0 01-1.4-1.4L12 5.5"/>
          </svg>
        </button>
        <button id="send-btn" class="btn btn--primary btn--icon" title="Send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9h12M10 4l5 5-5 5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Drop Overlay -->
  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-overlay__text">Drop to share</div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- QR Modal -->
  <div id="qr-modal" class="modal-backdrop">
    <div class="modal qr-modal">
      <div class="modal__title">Room QR Code</div>
      <canvas id="qr-modal-canvas"></canvas>
      <div id="qr-modal-link" class="qr-modal__link"></div>
      <div class="modal__actions">
        <button id="qr-modal-close-btn" class="btn btn--secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal__title">Settings</div>
      <div class="modal__field">
        <label class="modal__label">Device Label</label>
        <input id="settings-device-label" class="input" type="text" placeholder="e.g. My Laptop">
      </div>
      <div class="modal__field">
        <label class="modal__label">Default TTL (minutes)</label>
        <input id="settings-ttl" class="input" type="number" value="30" min="1" max="1440">
      </div>
      <div class="modal__actions">
        <button id="settings-close-btn" class="btn btn--secondary">Close</button>
        <button id="settings-save-btn" class="btn btn--primary">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
